<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Wave Cyan Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Outer Border Ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Background Decorative Rays/Sparkle -->
  <circle cx="256" cy="256" r="180" fill="#38bdf8" opacity="0.05" />

  <!-- Group Emblem -->
  <g transform="translate(0, 10)">
    <!-- Ocean Wave Base (Kota Garam & Pesona Bahari) -->
    <path d="M 120 370 C 180 340, 230 400, 290 370 C 350 340, 400 380, 420 365 C 420 395, 380 420, 256 420 C 140 420, 92 390, 92 390 Z" fill="url(#waveGrad)" opacity="0.4" />
    <path d="M 92 385 C 160 350, 220 400, 280 365 C 340 330, 390 375, 420 355 C 390 410, 310 435, 256 435 C 170 435, 110 410, 92 385 Z" fill="url(#goldGrad)" opacity="0.85" />

    <!-- Stylized "R" Emblem & Sailing Beacon -->
    <!-- Vertical Pillar of 'R' (Lighthouse / Beacon) -->
    <path d="M 155 120 L 195 120 L 195 360 L 155 360 Z" fill="#ffffff" rx="6" />
    
    <!-- Top Arc of 'R' (Crown & Sun Motif) -->
    <path d="M 195 120 L 290 120 C 345 120, 355 185, 290 195 L 195 195 Z" fill="#ffffff" />
    <path d="M 225 150 L 280 150 C 315 150, 315 170, 280 170 L 225 170 Z" fill="url(#bgGrad)" />

    <!-- Dynamic Diagonal Leg of 'R' (Sailing Wave / Kartini's Forward Movement) -->
    <path d="M 230 195 L 340 360 L 285 360 L 195 230 Z" fill="#ffffff" />
    
    <!-- Salt Crystal / Star Motif (Top Right) -->
    <g transform="translate(370, 130)" filter="url(#glow)">
      <!-- 4-point Diamond Star -->
      <path d="M 0 -38 L 10 -10 L 38 0 L 10 10 L 0 38 L -10 10 L -38 0 L -10 -10 Z" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
    </g>
  </g>
</svg>
