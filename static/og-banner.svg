<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Radial Glow in Center -->
  <circle cx="350" cy="315" r="300" fill="#38bdf8" opacity="0.08" />

  <!-- Background Decorative Wave Lines -->
  <path d="M 0 520 Q 300 440 600 530 T 1200 500 L 1200 630 L 0 630 Z" fill="#38bdf8" opacity="0.05" />
  <path d="M 0 560 Q 400 480 800 570 T 1200 540 L 1200 630 L 0 630 Z" fill="url(#goldGrad)" opacity="0.08" />

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="32" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" />

  <!-- Left: LOGO EMBLEM CARD (Size 340x340) -->
  <g transform="translate(100, 145)">
    <!-- Emblem Outer Rounded Box -->
    <rect width="340" height="340" rx="72" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.8" filter="url(#glow)" />
    <circle cx="170" cy="170" r="130" fill="#38bdf8" opacity="0.05" />

    <!-- Emblem Graphics inside Card -->
    <g transform="translate(0, 5)">
      <!-- Wave Base -->
      <path d="M 80 245 C 120 225, 150 265, 190 245 C 230 225, 260 250, 275 240 C 275 260, 250 278, 170 278 C 90 278, 60 258, 60 240 Z" fill="url(#waveGrad)" opacity="0.4" />
      <path d="M 60 255 C 105 230, 145 265, 185 242 C 225 218, 255 248, 275 235 C 255 272, 205 288, 170 288 C 115 288, 75 272, 60 255 Z" fill="url(#goldGrad)" opacity="0.9" />

      <!-- "R" Pillar -->
      <path d="M 102 80 L 128 80 L 128 238 L 102 238 Z" fill="#ffffff" rx="4" />
      <!-- "R" Loop -->
      <path d="M 128 80 L 190 80 C 228 80, 235 124, 190 130 L 128 130 Z" fill="#ffffff" />
      <path d="M 148 100 L 185 100 C 208 100, 208 114, 185 114 L 148 114 Z" fill="#0f172a" />
      <!-- "R" Leg -->
      <path d="M 152 130 L 225 238 L 188 238 L 128 152 Z" fill="#ffffff" />

      <!-- Top Right Star -->
      <g transform="translate(245, 88)">
        <path d="M 0 -25 L 7 -7 L 25 0 L 7 7 L 0 25 L -7 7 L -25 0 L -7 -7 Z" fill="url(#goldGrad)" />
        <circle cx="0" cy="0" r="4" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- Right: TEXT CONTENT -->
  <g transform="translate(500, 145)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#d97706" opacity="0.2" />
    <rect x="0" y="0" width="310" height="38" rx="19" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6" />
    <text x="155" y="24" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="2">
      KARYA PEMUDA REMBANG ASLI
    </text>

    <!-- Main Title -->
    <text x="0" y="105" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
      KABUPATEN REMBANG
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" letter-spacing="1">
      Bumi Kartini • Kota Garam • Pesona Bahari
    </text>

    <!-- Description / Highlights Box -->
    <g transform="translate(0, 175)">
      <rect width="600" height="110" rx="20" fill="#0f172a" opacity="0.6" stroke="#1e293b" stroke-width="2" />
      
      <text x="24" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="17">
        🏖️ Wisata Bahari &amp; Pantai Karang Jahe
      </text>
      <text x="24" y="70" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="17">
        🏛️ Sejarah R.A. Kartini &amp; Batik Tulis Lasem
      </text>
      <text x="24" y="98" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="17">
        🍲 Kuliner Lontong Tuyuhan &amp; 14 Kecamatan
      </text>
    </g>

    <!-- Domain Footer -->
    <text x="0" y="325" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16">
      🌐 rembangwebsite.my.id
    </text>
  </g>
</svg>
